<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- KHO Games app icon. Source for `pnpm tauri icon app-icon.svg`.
       Full-bleed background (iOS forbids transparency, Android masks the shape);
       the 3×3 tile motif stays inside the central adaptive-icon safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(302 302)">
    <rect x="0"   y="0"   width="128" height="128" rx="28" fill="#ffffff"/>
    <rect x="148" y="0"   width="128" height="128" rx="28" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="296" y="0"   width="128" height="128" rx="28" fill="#ffffff"/>
    <rect x="0"   y="148" width="128" height="128" rx="28" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="148" y="148" width="128" height="128" rx="28" fill="#fbbf24"/>
    <rect x="296" y="148" width="128" height="128" rx="28" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="0"   y="296" width="128" height="128" rx="28" fill="#ffffff"/>
    <rect x="148" y="296" width="128" height="128" rx="28" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="296" y="296" width="128" height="128" rx="28" fill="#ffffff"/>
  </g>
</svg>
